[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spendrouter"
version = "0.2.0"
description = "One agent-spend tool: route each call to the cheapest acceptable spend tier, and contain running agents behind a metering, capping proxy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Ashish Bhatt" }]
keywords = ["llm", "cost", "budget", "router", "quota", "agents", "proxy", "circuit-breaker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# pyyaml is only used by tests that cross-check the built-in YAML parser.
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
spendrouter = "spendrouter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spendrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
