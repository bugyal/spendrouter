[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spendrouter"
version = "0.1.0"
description = "Route model calls to the cheapest acceptable spend tier and hold the line on hard caps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Ashish Bhatt" }]
keywords = ["llm", "cost", "budget", "router", "quota", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spendrouter = "spendrouter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spendrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
